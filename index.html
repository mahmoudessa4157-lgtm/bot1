<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M3MO HOST | منصة استضافة بوتات التليجرام</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 2rem;
      color: var(--accent-green);
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-main);
    }

    input[type="text"],
    textarea {
      width: 100%;
      background-color: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #58a6ff;
      padding: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--accent-green);
    }

    textarea {
      font-family: 'Courier New', Courier, monospace;
      height: 220px;
      resize: vertical;
      direction: ltr;
      text-align: left;
      line-height: 1.5;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-green);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #059669;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }

    .logs-container {
      margin-top: 25px;
      background-color: #050811;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      height: 160px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      direction: ltr;
      text-align: left;
    }

    .log-line {
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .log-info { color: var(--text-muted); }
    .log-success { color: var(--accent-green); font-weight: bold; }
    .log-error { color: var(--accent-red); font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>M3MO HOST ⚡</h1>
      <p>منصة استضافة بوتات التليجرام مجاناً 24/7 عبر Vercel & Firebase</p>
    </div>

    <div class="form-group">
      <label for="botToken">توكن البوت (Bot Token):</label>
      <input type="text" id="botToken" placeholder="مثال: 8781731878:AAFu_UxTiYa..." />
    </div>

    <div class="form-group">
      <label for="botCode">كود البوت (JavaScript):</label>
      <textarea id="botCode" placeholder="// استخدم المتغيرات المتاحة تلقائياً: chatId, text, token
if (text === '/start') {
  await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: chatId,
      text: 'أهلاً بك! البوت يعمل 24/7 على منصة M3MO Host 🚀'
    })
  });
}"></textarea>
    </div>

    <button class="btn-submit" onclick="deployBot()">نشر وتشغيل البوت 🚀</button>

    <div class="logs-container" id="logs">
      <div class="log-line log-info">[SYSTEM] جاهز للاستضافة. أدخل التوكن والكود واضغط نشر.</div>
    </div>
  </div>

  <script>
    // رابط قاعدة بيانات Firebase الخاصة بك بناءً على الـ projectId
    const FIREBASE_DB_URL = "https://bot1-bd984-default-rtdb.firebaseio.com";

    function appendLog(message, type = 'info') {
      const logs = document.getElementById('logs');
      const time = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      line.textContent = `[${time}] ${message}`;
      logs.appendChild(line);
      logs.scrollTop = logs.scrollHeight;
    }

    async function deployBot() {
      const token = document.getElementById('botToken').value.trim();
      const code = document.getElementById('botCode').value.trim();
      const hostUrl = window.location.origin;

      if (!token || !code) {
        appendLog("يرجى إدخال التوكن والكود قبل المتابعة!", "error");
        return;
      }

      appendLog("جاري الاتصال بـ Firebase...", "info");

      try {
        const encodedToken = encodeURIComponent(token);
        const fbUrl = `${FIREBASE_DB_URL}/bots/${encodedToken}.json`;

        const saveResponse = await fetch(fbUrl, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: code,
            updated_at: Date.now()
          })
        });

        if (!saveResponse.ok) {
          throw new Error("فشل حفظ البيانات في Firebase.");
        }

        appendLog("تم حفظ الكود في Firebase بنجاح.", "success");
        appendLog("جاري ربط الـ Webhook مع تليجرام...", "info");

        const webhookEndpoint = `${hostUrl}/api/webhook?token=${encodedToken}`;
        const setupResponse = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            webhookUrl: webhookEndpoint
          })
        });

        const setupResult = await setupResponse.json();

        if (setupResult.ok) {
          appendLog("[SUCCESS] البوت يعمل الآن بنجاح ومربوط بالاستضافة 24/7!", "success");
        } else {
          appendLog(`[ERROR Telegram]: ${setupResult.description || 'فشل تفعيل الويب هوك'}`, "error");
        }

      } catch (err) {
        appendLog(`[ERROR]: ${err.message}`, "error");
      }
    }
  </script>
</body>
</html>
